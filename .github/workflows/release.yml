name: Release

# Runs on every push to main. When the push leaves pending changesets, it
# consumes them into CHANGELOG.md, commits the version straight to main, then
# publishes the GitHub Release for that version with its CHANGELOG section as
# the notes. A push with no pending changesets, including this workflow's own
# version commit, releases nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          # changeset version reads git history to find the commit behind each changeset.
          fetch-depth: 0

      - name: Find pending changesets
        id: pending
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pending changesets on main; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.pending.outputs.release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.pending.outputs.release == 'true'
        run: npm ci

      - name: Version
        if: steps.pending.outputs.release == 'true'
        run: npm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version
        if: steps.pending.outputs.release == 'true'
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version skills v$version"
          git push origin HEAD:main
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.pending.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found && (started || NF) { started = 1; print }' CHANGELOG.md > release-notes.md
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "v$VERSION" --notes-file release-notes.md
