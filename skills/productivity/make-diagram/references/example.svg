<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" role="img" aria-label="Two ways a bet gets settled: official stats are copied as-is; plays the AI tags must be proven by a clip before the deadline, or the bet is refunded and the miss retrains the tagger.">
  <style>
    .ground { fill: #ffffff; }
    .lane > rect { fill: #f3f5f8; stroke: #c9d1db; }
    .lane > text, .label, .legend text { fill: #1f2328; }
    .node > rect, .decision > polygon { stroke: #5b6573; stroke-width: 1.5; }
    .node text, .decision text { fill: #1f2328; }
    text { font-family: system-ui, sans-serif; font-size: 15px; }
    .title { font-weight: 600; font-size: 16px; }
    .arrow { fill: none; stroke-width: 2.5; }
    .yes { stroke: #2e9e5b; } .no { stroke: #d64545; } .data { stroke: #2f6fd6; }
    .loop { stroke: #d99a1e; stroke-dasharray: 8 6; } .next { stroke: #8a8f98; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #161b22; }
      .lane > rect { fill: #1f2630; stroke: #3a4452; }
      .lane > text, .label, .legend text { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="head-yes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e9e5b"/></marker>
    <marker id="head-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d64545"/></marker>
    <marker id="head-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fd6"/></marker>
    <marker id="head-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d99a1e"/></marker>
    <marker id="head-next" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a8f98"/></marker>
  </defs>
  <rect class="ground" x="0" y="0" width="1180" height="700"/>

  <g class="group lane">
    <rect x="20" y="20" width="900" height="160" rx="14"/>
    <text x="40" y="48" class="title">Official stats, used as-is</text>
  </g>
  <g class="group lane">
    <rect x="20" y="220" width="900" height="380" rx="14"/>
    <text x="40" y="248" class="title">AI-found plays, proven by a clip</text>
  </g>

  <g class="node">
    <rect x="50" y="70" width="200" height="80" rx="10" fill="#dbeafe"/>
    <text x="150" y="104" text-anchor="middle" class="title">League box score</text>
    <text x="150" y="126" text-anchor="middle">the final score</text>
  </g>
  <g class="node">
    <rect x="330" y="70" width="220" height="80" rx="10" fill="#dbeafe"/>
    <text x="440" y="104" text-anchor="middle" class="title">Copy official stats</text>
    <text x="440" y="126" text-anchor="middle">no AI touches them</text>
  </g>
  <g class="node">
    <rect x="50" y="300" width="200" height="80" rx="10" fill="#dbeafe"/>
    <text x="150" y="345" text-anchor="middle" class="title">Game video</text>
  </g>
  <g class="node">
    <rect x="330" y="300" width="220" height="80" rx="10" fill="#fde9c8"/>
    <text x="440" y="334" text-anchor="middle" class="title">AI tags each play</text>
    <text x="440" y="356" text-anchor="middle">LeBron jumper in Q4</text>
  </g>
  <g class="decision">
    <polygon points="700,265 820,340 700,415 580,340" fill="#ede4fb"/>
    <text x="700" y="336" text-anchor="middle">Proof clip found</text>
    <text x="700" y="356" text-anchor="middle">before deadline?</text>
  </g>
  <g class="node">
    <rect x="960" y="300" width="190" height="80" rx="10" fill="#d6f2e0"/>
    <text x="1055" y="334" text-anchor="middle" class="title">Settle the bet</text>
    <text x="1055" y="356" text-anchor="middle">winners paid that day</text>
  </g>
  <g class="node">
    <rect x="600" y="490" width="200" height="80" rx="10" fill="#fbdcdc"/>
    <text x="700" y="524" text-anchor="middle" class="title">Refund the bet</text>
    <text x="700" y="546" text-anchor="middle">e.g. no clip of the jumper</text>
  </g>
  <g class="node">
    <rect x="330" y="490" width="220" height="80" rx="10" fill="#fde9c8"/>
    <text x="440" y="524" text-anchor="middle" class="title">Label the miss</text>
    <text x="440" y="546" text-anchor="middle">retrains the tagger</text>
  </g>

  <path class="arrow data" d="M250 110 H328" marker-end="url(#head-data)"/>
  <path class="arrow data" d="M550 110 H1055 V298" marker-end="url(#head-data)"/>
  <path class="arrow data" d="M250 340 H328" marker-end="url(#head-data)"/>
  <path class="arrow next" d="M550 340 H578" marker-end="url(#head-next)"/>
  <path class="arrow yes" d="M820 340 H958" marker-end="url(#head-yes)"/>
  <text class="label" x="889" y="328" text-anchor="middle">yes</text>
  <path class="arrow no" d="M700 415 V488" marker-end="url(#head-no)"/>
  <text class="label" x="712" y="458">no</text>
  <path class="arrow loop" d="M600 530 H552" marker-end="url(#head-loop)"/>
  <path class="arrow loop" d="M440 490 V382" marker-end="url(#head-loop)"/>

  <g class="legend">
    <path class="arrow yes" d="M40 650 H80"/><text x="90" y="655">yes</text>
    <path class="arrow no" d="M170 650 H210"/><text x="220" y="655">no</text>
    <path class="arrow data" d="M290 650 H330"/><text x="340" y="655">data flow</text>
    <path class="arrow loop" d="M440 650 H480"/><text x="490" y="655">training loop</text>
    <path class="arrow next" d="M630 650 H670"/><text x="680" y="655">next step</text>
  </g>
</svg>
