cases:
  - name: "alignment starts the workflow"
    prompt: "Please align this idea and pressure-test the plan before we write anything."
    expected: "grill-with-docs"
  - name: "spec follows alignment"
    prompt: "Turn this into a spec with the decisions we already made."
    expected: "to-spec"
  - name: "tickets follow the spec"
    prompt: "Break this into vertical tickets with real blockers."
    expected: "to-tickets"
  - name: "implementation starts from an approved slice"
    prompt: "Implement the spec and build from the tickets."
    expected: "implement"
  - name: "tdd drives behavior"
    prompt: "Use red green refactor and write the test first."
    expected: "tdd"
  - name: "review closes the chain"
    prompt: "Run a pre-merge review of this diff."
    expected: "code-review"
  - name: "explicit names win"
    prompt: "Use $to-spec even though this could sound like ticket work."
    expected: "to-spec"
  - name: "generic tickets are a near miss"
    prompt: "I bought concert tickets for Friday."
    expected: null
    near_miss_of: "to-tickets"
  - name: "generic review is a near miss"
    prompt: "Please review a dinner menu."
    expected: null
    near_miss_of: "code-review"
  - name: "generic test is a near miss"
    prompt: "The test runner is slow today."
    expected: null
    near_miss_of: "tdd"
  - name: "unrelated request stays unrouted"
    prompt: "What is the weather in Toronto?"
    expected: null
